name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 jq shellcheck
      - run: shellcheck -S warning lethe tests/run.sh && shellcheck -s sh install.sh
      - run: tests/run.sh
      - name: install.sh on Linux (bash)
        run: |
          # A PATH without ~/.local/bin, as on a fresh machine: the installer must add it.
          env PATH=/usr/bin:/bin SHELL=/bin/bash LETHE_VERSION=${{ github.sha }} sh install.sh | tee out
          grep -q 'added to your PATH' out
          env -i HOME="$HOME" TERM=dumb PATH=/usr/bin:/bin bash -ic 'lethe --version'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install bash jq
      - run: bash --version | head -1 && sqlite3 --version
      - run: tests/run.sh
      - name: install.sh on a fresh macOS user (zsh)
        run: |
          env PATH=/usr/bin:/bin SHELL=/bin/zsh LETHE_VERSION=${{ github.sha }} sh install.sh | tee out
          grep -q 'added to your PATH' out
          env -i HOME="$HOME" TERM=dumb PATH=/usr/bin:/bin:/opt/homebrew/bin zsh -ic 'lethe --version'
