name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 jq shellcheck
      - run: shellcheck -S warning lethe tests/run.sh
      - run: tests/run.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install bash jq
      - run: bash --version | head -1 && sqlite3 --version
      - run: tests/run.sh
