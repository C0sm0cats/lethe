name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 jq shellcheck
      - run: shellcheck -S warning lethe tests/run.sh && shellcheck -s sh install.sh
      - run: tests/run.sh
      - name: install.sh on Linux (bash)
        run: |
          SHELL=/bin/bash LETHE_VERSION=${{ github.sha }} sh install.sh
          bash -ic 'lethe --version'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install bash jq
      - run: bash --version | head -1 && sqlite3 --version
      - run: tests/run.sh
      - name: install.sh on a fresh macOS user (zsh)
        run: |
          SHELL=/bin/zsh LETHE_VERSION=${{ github.sha }} sh install.sh
          zsh -ic 'lethe --version'
